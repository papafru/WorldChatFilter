name: Lua regression tests

on:
  push:
    branches: [main]
    paths:
      - "**.lua"
      - "tests/**"
      - ".github/workflows/lua-tests.yml"
  pull_request:
    paths:
      - "**.lua"
      - "tests/**"

permissions:
  contents: read

jobs:
  lua-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run full regression suite
        run: python3 tests/run_tests.py lua5.1
