name: Publish WorldChatFilter v1.1.0

# One-shot stable release. This workflow is intentionally triggered only
# when the release workflow itself first lands on main.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.1.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata and addon modules
        run: |
          set -eu
          grep -Fq 'WCF.VERSION = "1.1.0"' Core.lua
          grep -Fq '## Version: 1.1.0' WorldChatFilter.toc
          if grep -Eq '(^|/)1\.1\.0-dev' WorldChatFilter.toc; then exit 1; fi
          for f in Core.lua CustomFilters.lua PanelTheme.lua Color.lua Statistics.lua HelpUI.lua Classifier.lua Filter.lua CustomFiltersUI.lua UI.lua; do
            test -s "$f"
            grep -Fq "$f" WorldChatFilter.toc
          done
          test -s Media/WorldChatFilterOrb.tga
          test -s RELEASE_NOTES.md

      - name: Run all 35 Lua regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          python3 tests/run_tests.py lua5.1

      - name: Create installation-ready ZIP and verify contents
        run: |
          set -eu
          mkdir -p dist/WorldChatFilter/Media
          cp WorldChatFilter.toc Core.lua CustomFilters.lua PanelTheme.lua Color.lua Statistics.lua HelpUI.lua Classifier.lua Filter.lua CustomFiltersUI.lua UI.lua README.md LICENSE dist/WorldChatFilter/
          cp Media/WorldChatFilterOrb.tga dist/WorldChatFilter/Media/
          (cd dist && zip -qr ../WorldChatFilter-v1.1.0.zip WorldChatFilter)
          unzip -t WorldChatFilter-v1.1.0.zip
          for file in WorldChatFilter/WorldChatFilter.toc WorldChatFilter/Core.lua WorldChatFilter/HelpUI.lua WorldChatFilter/CustomFiltersUI.lua; do
            unzip -Z1 WorldChatFilter-v1.1.0.zip | grep -Fx "$file"
          done
          sha256sum WorldChatFilter-v1.1.0.zip

      - name: Publish official GitHub release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "::error::v1.1.0 already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v1.1.0 WorldChatFilter-v1.1.0.zip \
            --target "$GITHUB_SHA" \
            --title "World Chat Filter v1.1.0" \
            --notes-file RELEASE_NOTES.md \
            --latest
